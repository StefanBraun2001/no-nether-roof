# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 26.2
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        # gradle.properties pins org.gradle.java.home to Stefan's local Windows
        # JDK path (needed there since multiple mods pin different JDKs per
        # project) - override it here so CI uses the JDK setup-java just installed
        # instead of failing on a path that doesn't exist on this runner.
        run: ./gradlew build "-Dorg.gradle.java.home=$JAVA_HOME"
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: 26.2/build/libs/
